<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude 自动续跑监听器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <div class="logo">⟳</div>
          <div class="brand-text">
            <h1>Claude 自动续跑监听器</h1>
            <p>监听 ~/.claude 会话记录，发现截断或明确未完成后，自动向 Claude Code 或 Claude CLI 发送继续</p>
          </div>
        </div>
        <div class="status-pill" id="status-pill">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">未启动</span>
        </div>
      </header>

      <div class="content">
        <!-- Session card -->
        <section class="card">
          <div class="card-head"><span class="idx">1</span><span>Claude 会话</span></div>
          <div class="card-body">
            <div class="row">
              <select id="session-select" class="select grow"></select>
              <button class="btn" id="btn-refresh-sessions">刷新会话</button>
              <button class="btn" id="btn-open-folder">打开目录</button>
            </div>
            <div class="row">
              <label class="field-label mr">目标窗口</label>
              <select id="window-select" class="select grow"></select>
              <button class="btn" id="btn-refresh-windows">刷新窗口</button>
              <button class="btn" id="btn-bind">3 秒后绑定当前窗口</button>
            </div>
          </div>
        </section>

        <!-- Settings card -->
        <section class="card">
          <div class="card-head"><span class="idx">2</span><span>监听设置</span></div>
          <div class="card-body">
            <div class="grid2">
              <div class="field">
                <label class="field-label">客户端类型</label>
                <select id="cfg-target" class="select">
                  <option value="auto">自动（VS Code 或终端）</option>
                  <option value="vscode">Claude Code（VS Code 插件）</option>
                  <option value="terminal">Claude CLI（终端）</option>
                </select>
              </div>
              <div class="field">
                <label class="field-label">判断模式</label>
                <select id="cfg-mode" class="select">
                  <option value="safe">安全：只处理 max_tokens</option>
                  <option value="smart">智能：截断 + 明确未完成语句</option>
                  <option value="strict">严格：直到检测到完成标记</option>
                </select>
              </div>
            </div>
            <div class="grid4">
              <div class="field">
                <label class="field-label">静默等待（秒）</label>
                <input type="number" id="cfg-quiet" class="input" min="0.5" step="1" />
              </div>
              <div class="field">
                <label class="field-label">最大续跑次数</label>
                <input type="number" id="cfg-max" class="input" min="1" step="1" />
              </div>
              <div class="field">
                <label class="field-label">发送冷却（秒）</label>
                <input type="number" id="cfg-cooldown" class="input" min="0.5" step="1" />
              </div>
              <div class="field">
                <label class="field-label">断线判定（秒）</label>
                <input type="number" id="cfg-stalled" class="input" min="1" step="5" />
              </div>
            </div>
            <div class="field">
              <label class="field-label">续跑提示词</label>
              <textarea id="cfg-prompt" class="input textarea" rows="2"></textarea>
            </div>
            <div class="row switches">
              <label class="switch"><input type="checkbox" id="cfg-check-existing" /><span>启动时检查当前已停止状态</span></label>
              <label class="switch"><input type="checkbox" id="cfg-follow-latest" /><span>自动跟随最新会话（多窗口时慎用）</span></label>
            </div>
          </div>
        </section>

        <!-- Controls -->
        <div class="controls">
          <button class="btn btn-primary" id="btn-toggle">▶ 开始监听</button>
          <button class="btn" id="btn-analyze">立即分析一次</button>
          <button class="btn" id="btn-test">测试发送</button>
          <span class="spacer"></span>
          <button class="btn btn-ghost" id="btn-log">打开日志</button>
        </div>

        <!-- Log -->
        <section class="card log-card">
          <div class="card-head"><span class="idx dot">≡</span><span>运行日志</span></div>
          <div class="log-box" id="log-box"></div>
        </section>

        <p class="footer">安全提示：程序最多续跑指定次数；不会自动批准权限弹窗，也不会绕过 Claude Code 的安全确认。</p>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast"></div>

      <!-- Modal dialog -->
      <div class="modal-mask" id="modal-mask">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <div class="modal-head">
            <span class="modal-icon" id="modal-icon">!</span>
            <h2 class="modal-title" id="modal-title">确认</h2>
          </div>
          <p class="modal-body" id="modal-body"></p>
          <div class="modal-actions">
            <button class="btn" id="modal-cancel">取消</button>
            <button class="btn btn-primary" id="modal-ok">确定</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
